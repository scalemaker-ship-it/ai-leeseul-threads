name: 이슬(@ai_leeseul) 스레드 자동 게시 (하루 1회)

# 하루 1회, 저녁 발행. 월~토 게시, 일요일은 스크립트가 스스로 쉼.
# 2026-09-04 미리작성 큐(queue.json) 발행으로 전환 — Claude 크레딧 0으로 동작.
#   우선순위: oneoff_post.txt(오늘 DATE, publish-evening 담당) > queue.json 순서 발행.
#   발행 기록은 posted_log.json 에 남기고 이 워크플로가 커밋한다(같은 날 중복 발행 차단).
#   큐가 소진되면 실패(빨간불)로 끝나 '큐 채울 때'라는 신호가 된다.
#
# GitHub Actions 크론은 UTC 기준 (KST = UTC+9).
# 무료 러너의 스케줄 크론은 혼잡 시 수십 분~수 시간 늦게 뜰 수 있다.
# 자정을 넘겨 일요일로 넘어가면 스크립트가 '일요일 쉼'으로 스킵되므로,
# 지연이 심해도 같은 날 안에 발행되도록 크론을 20:00 KST(11:00 UTC)로 당겨 두고
# 시작 직후 0~60분 랜덤 지연으로 20:00~21:00 사이에 분산 발행한다.
on:
  schedule:
    - cron: "0 11 * * 1-6"   # 20:00 KST, 월~토
  workflow_dispatch:          # 수동 실행 버튼
    inputs:
      dry_run:
        description: "게시하지 않고 오늘 나갈 글만 확인 (토큰 불필요)"
        type: boolean
        default: false

permissions:
  contents: write             # posted_log.json 커밋용

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # 크론 실행일 때만 랜덤 지연 (수동 실행은 즉시)
      - name: 랜덤 지연 (게시 시각 분산)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 3600))   # 0~60분
          echo "약 $((DELAY / 60))분 대기 후 게시합니다."
          sleep $DELAY

      - name: 스레드 게시 (큐 발행)
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python threads_post.py --dry-run
          else
            python threads_post.py
          fi

      - name: 발행 기록 커밋 (posted_log.json)
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_log.json
          if git diff --cached --quiet; then
            echo "발행 기록 변경 없음 — 커밋 생략."
            exit 0
          fi
          git commit -m "발행 기록: $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push origin main
